name: validate

on:
  push:
  pull_request:
  # upstream-sync dispatches the gate on its branch: pushes by GITHUB_TOKEN start no workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    container: archlinux:base
    strategy:
      fail-fast: false
      matrix:
        wacli:
          # Minimum accepted release (0.23 is skipped for its archive-state
          # recovery bug, wacli #501), the first release with send file
          # --max-size-mb, and the newest verified release.
          - version: 0.24.0
            sha256: 4ca5c668d41f68bad18bf12e7966aba7c1b3cc6ae32fd8e145deb987ddd1192d
          - version: 0.25.1
            sha256: 53bbb450f0a47e3b080173d61fd6cec72241d8065bee17e592275983b7abd281
          - version: 0.26.0
            sha256: 2c28f65e2f9aaf32585288229db1f916c6c5fb5db9513715017d528513604b44
    name: release-gate (wacli ${{ matrix.wacli.version }})
    steps:
      - name: Install pinned test prerequisites
        run: >-
          pacman -Syu --noconfirm
          bash coreutils curl ffmpeg findutils gcc git inotify-tools jq make pkgconf python
          qt6-declarative qt6-imageformats kimageformats qt6-multimedia ripgrep systemd tar
          util-linux wl-clipboard xdg-utils zenity gtk4

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the audited Omarchy shell API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: omacom/omarchy
          ref: c668141e9c42b13c80c9ca4ea108e11708c5e8a5 # v4.0.4
          path: .omarchy
          sparse-checkout: |
            bin
            shell

      - name: Install audited wacli ${{ matrix.wacli.version }}
        env:
          WACLI_VERSION: ${{ matrix.wacli.version }}
          WACLI_SHA256: ${{ matrix.wacli.sha256 }}
        run: |
          archive="$RUNNER_TEMP/wacli_${WACLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/openclaw/wacli/releases/download/v${WACLI_VERSION}/wacli_${WACLI_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$WACLI_SHA256" "$archive" | sha256sum --check --strict
          install -d "$RUNNER_TEMP/omawhatsapp-home/.local/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/omawhatsapp-home/.local/bin" ./wacli

      - name: Run the complete release gate
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          export HOME="$RUNNER_TEMP/omawhatsapp-home"
          export PATH="/usr/lib/qt6/bin:$GITHUB_WORKSPACE/.omarchy/bin:$PATH"
          export OMARCHY_SHELL_DIR="$GITHUB_WORKSPACE/.omarchy/shell"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/test

  private-transport:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install build prerequisites
        run: pacman -Syu --noconfirm git go gcc python shadow util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out audited dependency source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/wacli
          ref: 535a8b969cc83c3aad57f66be77e8fd4a7fcaaa3
          path: .wacli-source
      - name: Test and build the private wacli extension from its two bundled patches
        run: |
          # Permission regressions must run as an ordinary Unix account.
          useradd --create-home --uid 1001 oma-ci
          chown -R oma-ci:oma-ci "$GITHUB_WORKSPACE"
          runuser -u oma-ci -- python scripts/build-private-wacli .wacli-source /tmp/wacli-private --test --provenance /tmp/wacli-build-evidence.json
          runuser -u oma-ci -- python tests/private_wacli_smoke.py /tmp/wacli-private

      - name: Record the tested source-to-binary build evidence
        run: |
          cat /tmp/wacli-build-evidence.json
          sha256sum /tmp/wacli-private dependencies/*.patch
          printf '### Private wacli build evidence\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/wacli-build-evidence.json >> "$GITHUB_STEP_SUMMARY"
          printf '```\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          sha256sum dependencies/*.patch >> "$GITHUB_STEP_SUMMARY"
          printf '```\nSource-built in this run, including the -race queue and outcome tests; no prebuilt executable is offered for installation.\n' >> "$GITHUB_STEP_SUMMARY"
